<svg width="64" height="64" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vertical pillar gradient -->
    <linearGradient id="fav-spine-grad" x1="10" y1="8" x2="20" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4285f4" />
      <stop offset="50%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <!-- Upper loop gradient -->
    <linearGradient id="fav-loop-grad" x1="16" y1="8" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#0f4bb8" />
    </linearGradient>

    <!-- Dynamic diagonal kick gradient (Growth Green) -->
    <linearGradient id="fav-kick-grad" x1="22" y1="23" x2="42" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Badge background gradient -->
    <linearGradient id="fav-badge-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded squircle background container -->
  <rect
    x="1.5"
    y="1.5"
    width="45"
    height="45"
    rx="13"
    fill="url(#fav-badge-bg)"
    stroke="#1a73e8"
    stroke-width="1.5"
  />

  <!-- Ambient blue glow -->
  <circle cx="24" cy="24" r="16" fill="#1a73e8" fill-opacity="0.25" />

  <!-- Stylized 'R' - Left Vertical Pillar -->
  <path
    d="M11 11.5C11 9.567 12.567 8 14.5 8H17C18.933 8 20.5 9.567 20.5 11.5V36.5C20.5 38.433 18.933 40 17 40H14.5C12.567 40 11 38.433 11 36.5V11.5Z"
    fill="url(#fav-spine-grad)"
  />

  <!-- Stylized 'R' - Upper Curved Loop -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M17 8H28C34.075 8 39 12.253 39 17.5C39 22.747 34.075 27 28 27H17V8ZM20.5 14H27.5C30.538 14 33 15.567 33 17.5C33 19.433 30.538 21 27.5 21H20.5V14Z"
    fill="url(#fav-loop-grad)"
  />

  <!-- Stylized 'R' - Forward Acceleration Diagonal Kick -->
  <path
    d="M23 23.5C23.8 23.5 24.5 23.9 25 24.6L36.2 38.4C36.9 39.3 36.2 40 35.1 40H29.8C29.1 40 28.5 39.6 28 39L18.8 26.8C18.4 26.2 18.7 25.5 19.4 25.5H23V23.5Z"
    fill="url(#fav-kick-grad)"
  />

  <!-- Local Search / Geolocation Core Dot -->
  <circle cx="26.5" cy="17.5" r="2.6" fill="#38bdf8" />
  <circle cx="26.5" cy="17.5" r="1.2" fill="#ffffff" />
</svg>
